<div class="bg-white rounded-2xl shadow-lg hover:shadow-xl transition-all duration-300 transform hover:-translate-y-2 overflow-hidden group cursor-pointer"
     [routerLink]="'/product/' + product._id">

  <div class="relative overflow-hidden">
    <img [src]="product.image[0]" [alt]="product.name"
         class="w-full h-64 object-cover group-hover:scale-110 transition duration-300">

    <div class="absolute top-3 left-3 flex flex-col space-y-2">
      <span *ngIf="product.isFeatured"
            class="bg-red-500 text-white px-3 py-1 rounded-full text-xs font-semibold">
        Featured
      </span>
      <span *ngIf="product.isNewProduct"
            class="bg-green-500 text-white px-3 py-1 rounded-full text-xs font-semibold">
        New
      </span>
    </div>

    <div *ngIf="product.discount > 0"
         class="absolute top-3 right-3 bg-yellow-500 text-white px-2 py-1 rounded-lg text-sm font-bold">
      Save ₹{{product.discount}}
    </div>
  </div>

  <div class="p-6">
    <h3 class="text-lg font-semibold text-gray-800 mb-2 line-clamp-2 hover:text-blue-600">
      {{product.name}}
    </h3>

    <p class="text-gray-600 text-sm mb-4 line-clamp-2">
      {{product.shortDescription}}
    </p>

    <div class="flex items-center justify-between mb-4">
      <div class="flex items-center space-x-2">
        <span class="text-2xl font-bold text-gray-800">₹{{getFinalPrice() | number}}</span>
        <span *ngIf="product.discount > 0" class="text-sm text-gray-500 line-through">
          ₹{{product.price | number}}
        </span>
      </div>
      <div *ngIf="product.discount > 0" class="text-green-600 text-sm font-semibold">
        {{calculateDiscountPercentage()}}% OFF
      </div>
    </div>

    <div class="flex space-x-2" *ngIf="showActions">
      <button (click)="onAddToCart($event)"
              class="flex-1 bg-blue-600 text-white py-2 px-4 rounded-lg hover:bg-blue-700 transition duration-300 font-semibold text-sm">
        Add to Cart
      </button>
      <button (click)="onAddToWishlist($event)"
              class="w-12 h-12 flex items-center justify-center border border-gray-300 rounded-lg hover:border-blue-600 hover:bg-blue-50 transition duration-300">
        <svg class="w-5 h-5 text-gray-600 hover:text-blue-600" fill="none" stroke="currentColor"
             viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z">
          </path>
        </svg>
      </button>
    </div>
  </div>
</div>
