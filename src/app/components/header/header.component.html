<header class="shadow-md bg-gradient-to-r from-blue-600 to-blue-800 text-white" *ngIf="auth_Service.isLoggedIn()">
  <!-- Top Bar -->
  <div class="container mx-auto px-4 py-3">
    <div class="flex items-center justify-between">
      <!-- Logo Section -->
      <div class="flex items-center space-x-3">
        <!-- Hamburger Menu (Mobile Only) -->
        <button 
          class="md:hidden text-2xl focus:outline-none"
          (click)="toggleMobileMenu()"
          aria-label="Toggle menu"
        >
          ☰
        </button>
        
        <!-- Logo -->
        <a 
          routerLink="/" 
          class="text-2xl font-bold text-white hover:text-blue-200 transition-colors duration-200"
        >
          Shop<span class="text-yellow-300">Ease</span>
        </a>
      </div>

      <!-- Search Bar (Hidden on mobile, visible on medium+) -->
      <div class="hidden md:flex flex-1 max-w-xl mx-6">
        <div class="relative w-full">
          <input 
            type="text" 
            placeholder="Search for products..." 
            (input)="onSearch($event)" 
            [(ngModel)]="SearchTerm"
            class="w-full px-4 py-2 pl-10 border rounded-full focus:outline-none focus:ring-2 focus:ring-yellow-400 text-gray-800"
          />
          <svg 
            class="absolute left-3 top-2.5 h-5 w-5 text-gray-400" 
            fill="none" 
            stroke="currentColor" 
            viewBox="0 0 24 24"
          >
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
          </svg>
        </div>
      </div>

      <!-- User Actions -->
      <div class="flex items-center space-x-4">
        <!-- Mobile Search Icon -->
        <button 
          class="md:hidden text-xl"
          (click)="toggleMobileSearch()"
          aria-label="Search"
        >
          🔍
        </button>
        
        <!-- User Profile -->
        <div class="hidden md:block">
          <a 
            [routerLink]="auth_Service.isAdmin() ? '/admin' : '/user-profile'" 
            class="flex items-center space-x-2 hover:text-blue-200 font-medium transition-colors duration-200"
          >
            <div class="w-8 h-8 bg-blue-500 rounded-full flex items-center justify-center">
              <span class="font-bold">{{ getUserInitials() }}</span>
            </div>
            <span>{{ getUserName() }}</span>
          </a>
        </div>
        
        <!-- Auth Buttons -->
        <div class="hidden md:flex items-center space-x-4">
          @if(auth_Service.isLoggedIn()) {
            <button 
              class="px-4 py-2 bg-red-500 hover:bg-red-600 rounded-lg font-medium transition-colors duration-200"
              (click)="logOut()"
            >
              Logout
            </button>
          } @else {
            <a 
              routerLink="/register" 
              class="px-4 py-2 bg-blue-500 hover:bg-blue-700 rounded-lg font-medium transition-colors duration-200"
            >
              Login
            </a>
            <a 
              routerLink="/register" 
              class="px-4 py-2 bg-yellow-500 hover:bg-yellow-600 rounded-lg font-medium transition-colors duration-200"
            >
              Register
            </a>
          }
        </div>
      </div>
    </div>
    
    <!-- Mobile Search Bar (Conditional) -->
    <div class="mt-3 md:hidden" *ngIf="showMobileSearch">
      <div class="relative">
        <input 
          type="text" 
          placeholder="Search for products..." 
          (input)="onSearch($event)" 
          [(ngModel)]="SearchTerm"
          class="w-full px-4 py-2 pl-10 border rounded-full focus:outline-none focus:ring-2 focus:ring-yellow-400 text-gray-800"
        />
        <svg 
          class="absolute left-3 top-2.5 h-5 w-5 text-gray-400" 
          fill="none" 
          stroke="currentColor" 
          viewBox="0 0 24 24"
        >
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
        </svg>
      </div>
    </div>
  </div>

  <!-- Navigation Bar -->
  <nav class="bg-blue-700 py-2 hidden md:block">
    <div class="container mx-auto px-4">
      <div class="flex flex-wrap justify-center md:justify-start space-x-4 lg:space-x-6">
        <div *ngFor="let category of categoryList">
          <button 
            class="px-3 py-1 hover:bg-blue-600 rounded-lg transition-colors duration-200 font-medium"
            (click)="onCategoryClick(category)"
          >
            {{category.name}}
          </button>
        </div>
      </div>
    </div>
  </nav>

  <!-- Mobile Menu Overlay -->
  <div 
    class="fixed inset-0 bg-black bg-opacity-50 z-50 md:hidden transition-opacity duration-300"
    [class.hidden]="!showMobileMenu"
    (click)="toggleMobileMenu()"
  ></div>
  
  <!-- Mobile Menu Panel -->
  <div 
    class="fixed top-0 left-0 h-full w-64 bg-blue-800 z-50 transform transition-transform duration-300 md:hidden"
    [class.translate-x-0]="showMobileMenu"
    [class.-translate-x-full]="!showMobileMenu"
  >
    <div class="p-6">
      <!-- Close Button -->
      <div class="flex justify-end mb-8">
        <button 
          class="text-2xl text-white hover:text-yellow-300"
          (click)="toggleMobileMenu()"
          aria-label="Close menu"
        >
          ×
        </button>
      </div>
      
      <!-- User Info -->
      <div class="mb-8">
        <a 
          [routerLink]="auth_Service.isAdmin() ? '/admin' : '/user-profile'" 
          class="flex items-center space-x-3 mb-6"
          (click)="toggleMobileMenu()"
        >
          <div class="w-12 h-12 bg-blue-500 rounded-full flex items-center justify-center">
            <span class="font-bold text-lg">{{ getUserInitials() }}</span>
          </div>
          <div>
            <div class="font-bold text-lg">{{ getUserName() }}</div>
            <div class="text-sm text-blue-200">
              {{ auth_Service.isAdmin() ? 'Administrator' : 'Customer' }}
            </div>
          </div>
        </a>
        
        @if(auth_Service.isLoggedIn()) {
          <button 
            class="w-full py-3 bg-red-500 hover:bg-red-600 rounded-lg font-medium transition-colors duration-200"
            (click)="logOut(); toggleMobileMenu()"
          >
            Logout
          </button>
        } @else {
          <div class="space-y-3">
            <a 
              routerLink="/register" 
              class="block w-full py-3 bg-blue-500 hover:bg-blue-700 rounded-lg font-medium text-center transition-colors duration-200"
              (click)="toggleMobileMenu()"
            >
              Login
            </a>
            <a 
              routerLink="/register" 
              class="block w-full py-3 bg-yellow-500 hover:bg-yellow-600 rounded-lg font-medium text-center transition-colors duration-200"
              (click)="toggleMobileMenu()"
            >
              Register
            </a>
          </div>
        }
      </div>
      
      <!-- Categories -->
      <div class="border-t border-blue-700 pt-6">
        <h3 class="font-bold text-lg mb-4 text-yellow-300">Categories</h3>
        <div class="space-y-2">
          <div *ngFor="let category of categoryList">
            <button 
              class="w-full text-left px-4 py-3 hover:bg-blue-700 rounded-lg transition-colors duration-200"
              (click)="onCategoryClick(category); toggleMobileMenu()"
            >
              {{category.name}}
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</header>
