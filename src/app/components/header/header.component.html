<header class="shadow-md">
    <div class="flex items-center justify-between  px-6 py-3 bg-blue-400">

        <div class="text-2xl font-bold text-blue-600 cursor-pointer">
       
            <a routerLink="/" class="cursor-pointer">ShopEase</a>
            
        </div>



        <div class="flex-1 max-w-sm mx-6">
            @if(auth_Service.isLoggedIn()){
            <input type="text" placeholder="Search for products... " (input)="onSearch($event)"
            [(ngModel)]="SearchTerm"  class="w-full px-4 py-2 border rounded-full focus:outline-none focus:ring-2 focus:ring-blue-400" />
            }
        </div>
        <div>
            <a routerLink="/profile" class="text-white hover:text-blue-600 font-bold text-lg ">
              @if(this.auth_Service.isAdmin()){
                  <a routerLink="/admin">{{getUserName()}}</a> 
              }@else{
                 <a routerLink="/user-profile">{{getUserName()}}</a>
              }
            </a>
            @if(auth_Service.isLoggedIn()) {
            <button class="ml-[10px] text-white hover:text-blue-600 font-bold text-lg" (click)="logOut()">
                logout
            </button>
            
            }@else{
            <a routerLink="/register" class="text-white hover:text-blue-600 font-bold text-lg">
                Login
            </a>
                <a routerLink="/register" class="text-white hover:text-blue-600 font-bold text-lg">
                Register
            </a>
            
            }
        </div>
    </div>


   
    <nav class="flex w-full    bg-blue-400 text-white  py-2">
        <div *ngFor="let category of categoryList ">
            <ul class="flex space-x-6">
                <li class="hover:underline cursor-pointer px-2" (click)="searchByCategory(category._id!)">
                    {{category.name}}</li>

            </ul>

        </div>
    </nav>
</header>
