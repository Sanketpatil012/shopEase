<div class="flex flex-col items-center px-40 mt-10">

    <h1 class="font-bold text-2xl ">Update the Brands</h1>
  
 <h1 class="font-bold text-2xl ">Add New Brands</h1>
  <form  class="shadow-sm w-96 p-4 ">
    <div class="flex flex-wrap">
      <div class="w-full gap-4">
         <mat-form-field class="w-full">
             <mat-label>FirstName</mat-label>
             <input matInput type="text"  [(ngModel)]="name" name="name">
         </mat-form-field>
        
      </div>
      <div class="w-full flex justify-center">
       @if(!isEdit){
        <button mat-raised-button color="primary" [disabled]="!name" *ngIf="!isEdit" (click)="add()">Add</button>
       }@else{
        <button mat-raised-button color="primary" [disabled]="!name" *ngIf="isEdit" (click)="update()"  >Edit </button>
       }

      </div>
    </div>
      
</form>
</div>
