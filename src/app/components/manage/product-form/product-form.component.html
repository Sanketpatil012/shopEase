<div class="flex flex-col items-center px-40 mt-10">

  @if(id){
  <h1>Edit New Prooduct</h1>
  }@else {
  <h1>Add New Prooduct</h1>
  }
  <form class="shadow p-4" [formGroup]="productForm">
    <div class="flex flex-wrap ">
      <mat-form-field class="w-full">
        <mat-label>Categories</mat-label>
        <mat-select formControlName="categoryId">
          <mat-option *ngFor="let item of categoryArray" [value]="item._id">{{item.name}}</mat-option>
        </mat-select>
      </mat-form-field>

      <mat-form-field class="w-full">
        <mat-label>Brands</mat-label>
        <mat-select formControlName="brandId">
          <mat-option *ngFor="let brand of BrandArray" [value]="brand._id">
            {{brand.name}}
          </mat-option>
        </mat-select>
      </mat-form-field>


      <mat-form-field class="w-full">
        <mat-label>Name</mat-label>
        <input matInput type="text" formControlName="name">
      </mat-form-field>

      <mat-form-field class="w-full">
        <mat-label>Short Description</mat-label>
        <input matInput type="text" formControlName="shortDescription">
      </mat-form-field>
      <mat-form-field class="w-full">
        <mat-label> Description</mat-label>
        <textarea matInput type="text" rows="5" formControlName="description"> </textarea>
      </mat-form-field>
      <mat-form-field class="w-full">
        <mat-label> Price</mat-label>
        <input matInput type="number" formControlName="price">
      </mat-form-field>
      <mat-form-field class="w-full">
        <mat-label> Discount</mat-label>
        <input matInput type="number" formControlName="discount">
      </mat-form-field>
       <div class="w-full flex gap-8">
      <mat-checkbox  formControlName="isFeatured">Is Featured</mat-checkbox>
      <mat-checkbox  formControlName="isNewProduct">Is New </mat-checkbox>
       </div>
     
      <div class="w-full flex flex-col space-y-4" formArrayName="images">
        <h4 class="text-center  font-bold text-lg">Images</h4>
        <div class="flex justify-between space-y-3">
          <button mat-raised-button color="primary" (click)="addImage()">Add Image</button>
          <button mat-raised-button color="primary" (click)="removeImage()">Remove Button</button>
        </div>
        <div class="space-y-3">
          @for(item of images.controls ; track $index){
          <mat-form-field class="w-full">
            <mat-label>Image {{ $index + 1 }}</mat-label>
            <input matInput type="text" [formControlName]="$index">
          </mat-form-field>
          }
        </div>

      </div>
    </div>
    <div class="flex justify-center">
      @if(this.id){
      <button mat-raised-button color="primary" [disabled]="productForm.invalid" (click)="updateProduct()">Edit</button>
      }@else {
      <button mat-raised-button color="primary" [disabled]="productForm.invalid" (click)="addProduct()">Add</button>
      }
    </div>
  </form>
</div>
