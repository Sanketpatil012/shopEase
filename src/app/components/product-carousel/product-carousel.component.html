<div class="relative w-full overflow-hidden rounded-xl bg-gray-900">
  <div class="relative h-80 md:h-96 lg:h-[500px]">
    
    <!-- Slides -->
    <div *ngFor="let product of products; let i = index" 
         class="absolute inset-0 transition-all duration-500 ease-in-out"
         [class.opacity-0]="currentSlide !== i"
         [class.opacity-100]="currentSlide === i"
         [class.z-0]="currentSlide !== i"
         [class.z-10]="currentSlide === i">
      
      <img [src]="product.image[0]" [alt]="product.name" 
           class="w-full h-full object-cover">
      
      <!-- Overlay Content -->
      <div class="absolute inset-0 bg-black bg-opacity-40 flex items-center">
        <div class="container mx-auto px-4 text-white">
          <div class="max-w-2xl">
            <!-- Badges -->
            <div class="flex gap-2 mb-4">
              <span *ngIf="product.isNewProduct" class="bg-green-500 px-3 py-1 rounded-full text-sm font-semibold">
                New
              </span>
              <span *ngIf="product.isFeatured" class="bg-red-500 px-3 py-1 rounded-full text-sm font-semibold">
                Featured
              </span>
              <span *ngIf="product.discount > 0" class="bg-yellow-500 px-3 py-1 rounded-full text-sm font-semibold">
                {{(product.discount / product.price * 100).toFixed(0)}}% OFF
              </span>
            </div>
            
            <!-- Product Name -->
            <h2 class="text-3xl md:text-5xl font-bold mb-4">{{product.name}}</h2>
            
            <!-- Description -->
            <p class="text-lg mb-6 text-gray-200 max-w-lg">{{product.shortDescription}}</p>
            
            <!-- Price -->
            <div class="flex items-center gap-4 mb-6">
              <span class="text-2xl md:text-3xl font-bold">₹{{(product.price - product.discount) | number}}</span>
              <span *ngIf="product.discount > 0" class="text-xl text-gray-300 line-through">
                ₹{{product.price | number}}
              </span>
            </div>
            
            <!-- Button -->
            <button class="bg-blue-600 text-white px-8 py-3 rounded-lg font-semibold hover:bg-blue-700 transition duration-300">
              Shop Now
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Loading State -->
    <div *ngIf="products.length === 0" class="absolute inset-0 flex items-center justify-center text-white">
      <div class="text-center">
        <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-white mx-auto mb-4"></div>
        <p>Loading carousel...</p>
      </div>
    </div>
  </div>

  <!-- Navigation Arrows - Only show if multiple products -->
  <button *ngIf="products.length > 1" 
          (click)="previousSlide()" 
          class="absolute left-4 top-1/2 -translate-y-1/2 bg-white/20 hover:bg-white/30 text-white rounded-full p-3 transition duration-300 z-20">
    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
    </svg>
  </button>
  
  <button *ngIf="products.length > 1" 
          (click)="nextSlide()" 
          class="absolute right-4 top-1/2 -translate-y-1/2 bg-white/20 hover:bg-white/30 text-white rounded-full p-3 transition duration-300 z-20">
    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
    </svg>
  </button>

  <!-- Dots Indicator - Only show if multiple products -->
  <div *ngIf="products.length > 1" class="absolute bottom-4 left-1/2 -translate-x-1/2 flex gap-2 z-20">
    <button *ngFor="let product of products; let i = index" 
            (click)="goToSlide(i)"
            class="w-3 h-3 rounded-full transition duration-300"
            [class]="currentSlide === i ? 'bg-white' : 'bg-white/50'">
    </button>
  </div>

  <!-- Slide Counter -->
  <div *ngIf="products.length > 1" class="absolute top-4 right-4 bg-black/50 text-white px-3 py-1 rounded-full text-sm z-20">
    {{currentSlide + 1}} / {{products.length}}
  </div>
</div>
